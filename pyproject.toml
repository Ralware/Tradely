[project]
name = "tradely"
version = "0.1.0"
description = "Private, local-first quantitative market analysis for equities and crypto"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
benchmark = ["psutil>=5.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["backend", "research", "research/tests"]
testpaths = ["backend/tests", "research/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"research/tests/test_*.py" = ["E402"] # Existing standalone unittest entry points.

[tool.mypy]
files = ["research/strategy_analyzer.py", "research/v42_exhaustive_combination_tester.py", "research/optimization_runtime.py", "research/benchmark_optimization.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["research"]
omit = ["research/tests/*", "research/benchmark_optimization.py"]
concurrency = ["multiprocessing"]
parallel = true

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
